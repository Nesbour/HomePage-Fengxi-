<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" type="image/png" href="./favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ff">
<meta name="description" content="风汐的个人主页，记录兴趣、日常与网络足迹。">
<title>风汐 · Personal Homepage</title>
<style>

:root {
  color-scheme: light;
  --bg: #f7f5fc;
  --surface: rgba(255,255,255,.68);
  --surface-solid: rgba(255,255,255,.88);
  --ink: #28243a;
  --muted: #817b91;
  --line: rgba(93,79,132,.14);
  --accent: #8874d5;
  --accent-2: #d79bbd;
  --accent-soft: #eee9ff;
  --shadow: 0 28px 80px rgba(62,49,100,.13);
  --tile-shadow: 0 8px 24px rgba(68,56,105,.045);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171522;
  --surface: rgba(37,33,54,.72);
  --surface-solid: rgba(43,38,62,.9);
  --ink: #f1edff;
  --muted: #aaa3bf;
  --line: rgba(220,211,255,.14);
  --accent: #b9a9ff;
  --accent-2: #dba8c7;
  --accent-soft: #332c4d;
  --shadow: 0 28px 80px rgba(0,0,0,.3);
  --tile-shadow: 0 8px 24px rgba(0,0,0,.12);
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body {
  min-height: 100svh;
  margin: 0;
  padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
  display: grid;
  place-items: center;
  overflow-x: hidden;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 7% 15%, rgba(190,174,255,.34), transparent 32%),
    radial-gradient(ellipse at 91% 17%, rgba(255,198,220,.3), transparent 30%),
    radial-gradient(ellipse at 70% 100%, rgba(164,205,255,.3), transparent 34%),
    var(--bg);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  transition: background-color .3s ease, color .3s ease;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
  background-image: linear-gradient(rgba(130,112,180,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(130,112,180,.07) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, black, transparent 82%);
}
.ambient { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
.orb {
  position: absolute; width: min(38vw, 430px); aspect-ratio: 1;
  border-radius: 50%; filter: blur(78px); opacity: .42;
  animation: drift 24s ease-in-out infinite alternate;
}
.orb.one { left: -12%; top: 12%; background: #b9a8ff; }
.orb.two { right: -10%; bottom: 0; background: #f3b9d2; animation-delay: -8s; }
.orb.three { width: min(28vw, 310px); right: 28%; top: -18%; background: #a8d5f2; animation-delay: -13s; }
@keyframes drift { to { transform: translate(30px, 24px) scale(1.1); } }
.page {
  width: min(100%, 1000px);
  display: grid;
  grid-template-columns: minmax(270px, .88fr) minmax(360px, 1.12fr);
  gap: clamp(36px, 7vw, 88px);
  align-items: center;
}
.intro { position: relative; padding: 22px 0; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--accent); font-size: .7rem; font-weight: 800;
  letter-spacing: .2em; text-transform: uppercase;
}
.eyebrow::before { content: ""; width: 26px; height: 1px; background: currentColor; }
.avatar-wrap { position: relative; width: 126px; margin: 28px 0 24px; }
.avatar {
  width: 116px; height: 116px; overflow: hidden; border-radius: 34px;
  transform: rotate(-4deg); border: 4px solid var(--surface-solid);
  box-shadow: 0 16px 42px rgba(73,58,120,.2);
  background: var(--accent-soft);
}
.avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.avatar-wrap::after {
  content: "✦"; position: absolute; right: -2px; top: -12px;
  color: var(--accent-2); font-size: 28px; transform: rotate(12deg);
}
h1 {
  margin: 0; font-size: clamp(3.1rem, 6.4vw, 5.2rem); line-height: 1;
  letter-spacing: .055em; font-weight: 820;
  user-select: none;
  -webkit-user-select: none;
}
.subtitle {
  max-width: 100%;
  margin: 12px auto 0;
  color: var(--muted);
  font-size: .68rem;
  letter-spacing: .14em;
  line-height: 1.6;
  font-weight: 650;
  white-space: normal;
  overflow-wrap: break-word;
  text-wrap: balance;
}
.tagline {
  max-width: 350px; margin: 30px 0 0; color: var(--muted);
  font-size: 1rem; line-height: 2; letter-spacing: .045em;
}
.intro-mark { display: flex; gap: 7px; margin-top: 32px; align-items: center; }
.intro-mark span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .32; }
.intro-mark span:first-child { width: 28px; border-radius: 9px; opacity: .9; }
.social-card {
  position: relative; padding: clamp(26px, 4.2vw, 42px);
  border: 1px solid var(--line); border-radius: 34px;
  background: var(--surface); backdrop-filter: blur(26px) saturate(145%);
  -webkit-backdrop-filter: blur(26px) saturate(145%);
  box-shadow: var(--shadow);
}
.social-card::before {
  content: ""; position: absolute; left: 30px; top: -1px;
  width: 76px; height: 3px; border-radius: 0 0 5px 5px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}
.card-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 18px; margin-bottom: 28px;
}
.card-title { margin: 0; font-size: 1.22rem; font-weight: 780; letter-spacing: .025em; }
.card-note { margin: 8px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.7; }
.theme-toggle {
  flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 15px;
  background: var(--surface-solid); color: var(--ink); cursor: pointer;
  transition: transform .2s ease, background .2s ease, border-color .2s ease;
}
.theme-toggle:hover { transform: translateY(-2px) rotate(-5deg); background: var(--accent-soft); }
.theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.links a {
  position: relative; min-width: 0; min-height: 104px; display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 11px;
  color: var(--ink); text-decoration: none; border: 1px solid var(--line);
  border-radius: 21px; background: var(--surface-solid); box-shadow: var(--tile-shadow);
  transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
}
.links a::after {
  content: attr(aria-label); font-size: .73rem; color: var(--muted);
  font-weight: 680; letter-spacing: .025em;
}
.links a:hover {
  transform: translateY(-5px); border-color: color-mix(in srgb, var(--accent) 48%, transparent);
  background: var(--accent-soft); box-shadow: 0 14px 28px rgba(88,72,140,.12);
}
.links a:active { transform: scale(.97); }
.links a:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.links svg, .links img { width: 25px; height: 25px; display: block; }
.links svg { fill: currentColor; }
.links a[aria-label="Bilibili"] svg { fill: none; }
.footer {
  margin: 26px 0 0; padding-top: 18px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: .68rem; letter-spacing: .08em;
  display: flex; justify-content: space-between; gap: 12px;
}
@media (min-width: 1200px) {
  .page { transform: translateY(-8px); }
}
@media (max-width: 760px) {
  body { padding: max(34px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom)); }
  .page { width: min(100%, 500px); grid-template-columns: 1fr; gap: 28px; }
  .intro { text-align: center; padding: 8px 0 0; }
  .eyebrow { justify-content: center; }
  .avatar-wrap { margin: 24px auto 22px; width: 110px; }
  .avatar { width: 104px; height: 104px; border-radius: 30px; }
  h1 {
    font-size: clamp(3rem, 12vw, 3.8rem);
    user-select: none;
    -webkit-user-select: none;
  }
  .subtitle {
    width: 100%;
    max-width: 300px;
    padding: 0 4px;
    font-size: clamp(.56rem, 3.1vw, .68rem);
    letter-spacing: .09em;
    line-height: 1.7;
    user-select: none;
    -webkit-user-select: none;
  }
  .tagline { margin: 20px auto 0; }
  .intro-mark { justify-content: center; margin-top: 22px; }
  .social-card { padding: 26px 20px; border-radius: 29px; }
  .card-top { margin-bottom: 22px; }
  .links { gap: 10px; }
  .links a { min-height: 94px; }
}
@media (max-width: 380px) {
  body { padding-left: 12px; padding-right: 12px; }
  .social-card { padding: 22px 14px; }
  .links { gap: 8px; }
  .links a { min-height: 84px; border-radius: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important; animation-duration: .01ms !important;
    animation-iteration-count: 1 !important; transition-duration: .01ms !important;
  }
}


/* Mobile refinement */
@media (max-width: 760px) {
  html { scroll-padding-top: 16px; }
  body {
    display: block;
    min-height: 100svh;
    padding:
      max(26px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  .page {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 26px;
  }
  .intro {
    width: 100%;
    padding: 4px 0 0;
    text-align: center;
  }
  .eyebrow {
    justify-content: center;
    font-size: .64rem;
    letter-spacing: .17em;
  }
  .avatar-wrap {
    width: 100px;
    margin: 21px auto 18px;
  }
  .avatar {
    width: 94px;
    height: 94px;
    border-width: 3px;
    border-radius: 27px;
  }
  .avatar-wrap::after {
    right: -1px;
    top: -10px;
    font-size: 24px;
  }
  h1 {
    font-size: clamp(2.8rem, 13vw, 3.6rem);
    line-height: 1.08;
    letter-spacing: .06em;
  }
  .subtitle {
    width: fit-content;
    max-width: min(100%, 280px);
    margin: 7px auto 0;
    padding: 0 5px;
    font-size: clamp(.58rem, 2.8vw, .66rem);
    letter-spacing: .10em;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  .tagline {
    max-width: 100%;
    margin: 16px auto 0;
    padding: 0 8px;
    font-size: .91rem;
    line-height: 1.8;
    letter-spacing: .025em;
  }
  .intro-mark {
    justify-content: center;
    margin-top: 17px;
  }

  .social-card {
    width: 100%;
    padding: 23px 18px 18px;
    border-radius: 25px;
    backdrop-filter: blur(18px) saturate(135%);
    -webkit-backdrop-filter: blur(18px) saturate(135%);
  }
  .social-card::before {
    left: 24px;
    width: 62px;
  }
  .card-top {
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .card-title {
    font-size: 1.08rem;
    line-height: 1.45;
  }
  .card-note {
    margin-top: 5px;
    font-size: .72rem;
  }
  .theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 13px;
  }
  .links {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .links a {
    min-height: 88px;
    gap: 9px;
    border-radius: 17px;
    -webkit-tap-highlight-color: transparent;
  }
  .links a::after {
    font-size: .72rem;
  }
  .links svg, .links img {
    width: 23px;
    height: 23px;
  }
  .links a:hover { transform: none; }
  .links a:active {
    transform: scale(.97);
    background: var(--accent-soft);
  }
  .footer {
    margin-top: 20px;
    padding-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
    text-align: center;
    gap: 7px 14px;
    font-size: .62rem;
    line-height: 1.6;
  }
  .orb { filter: blur(58px); opacity: .28; }
  body::before { background-size: 34px 34px; opacity: .15; }
}

@media (max-width: 360px) {
  body {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  .page { gap: 21px; }
  .social-card { padding: 20px 13px 15px; border-radius: 22px; }
  .links { gap: 8px; }
  .links a { min-height: 80px; border-radius: 15px; }
  .card-title { font-size: 1rem; }
  .card-note { font-size: .68rem; }
}

@media (min-width: 520px) and (max-width: 760px) {
  .links { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .links a { min-height: 92px; }
}


/* Interactive pointer effects: lift, glow, tilt and cursor trail */
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .social-card {
    transform-style: preserve-3d;
    will-change: transform;
    transition:
      transform .18s ease-out,
      border-color .25s ease,
      box-shadow .25s ease,
      background .25s ease;
    background:
      radial-gradient(
        360px circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
        rgba(177, 155, 255, .15),
        transparent 68%
      ),
      var(--surface);
  }
  :root[data-theme="dark"] .social-card {
    background:
      radial-gradient(
        360px circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
        rgba(185, 169, 255, .19),
        transparent 68%
      ),
      var(--surface);
  }
  .social-card.pointer-active {
    border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
    box-shadow: 0 32px 90px rgba(62,49,100,.2), 0 0 34px rgba(164,143,235,.12);
  }
  .avatar-wrap { transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .avatar-wrap:hover { transform: translateY(-4px) rotate(2deg); }
  .avatar { transition: box-shadow .3s ease, transform .3s ease; }
  .avatar-wrap:hover .avatar {
    transform: rotate(-1deg) scale(1.035);
    box-shadow: 0 20px 48px rgba(112,91,174,.28);
  }
  .links a {
    overflow: hidden;
    isolation: isolate;
  }
  .links a::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0;
    background: radial-gradient(circle at var(--tile-x, 50%) var(--tile-y, 50%),
      rgba(183,164,255,.22), transparent 66%);
    transition: opacity .22s ease;
  }
  .links a:hover::before { opacity: 1; }
  .links a:hover svg, .links a:hover img {
    transform: translateY(-3px) scale(1.1);
    filter: drop-shadow(0 4px 8px rgba(130,105,205,.2));
  }
  .links svg, .links img { transition: transform .22s ease, filter .22s ease; }
  .theme-toggle:hover { box-shadow: 0 8px 22px rgba(130,105,205,.18); }
  .cursor-glow {
    position: fixed;
    z-index: 20;
    left: 0;
    top: 0;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(183,164,255,.12), rgba(183,164,255,.045) 38%, transparent 70%);
    mix-blend-mode: screen;
    transition: opacity .25s ease;
  }
  body.pointer-seen .cursor-glow { opacity: 1; }
  .pointer-spark {
    position: fixed;
    z-index: 19;
    left: 0;
    top: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    background: var(--accent-2);
    box-shadow: 0 0 10px rgba(215,155,189,.55);
    animation: spark-fade .65s ease-out forwards;
  }
  @keyframes spark-fade {
    from { opacity: .8; transform: translate(-50%,-50%) scale(1); }
    to { opacity: 0; transform: translate(-50%,-50%) scale(.1) translateY(-12px); }
  }
}
@media (hover: none), (pointer: coarse) {
  .cursor-glow, .pointer-spark { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  .cursor-glow, .pointer-spark { display: none !important; }
}

</style>
</head>

<script>
(() => {
  const root = document.documentElement;
  const button = document.getElementById('themeToggle');
  let saved = null;
  try { saved = localStorage.getItem('fengxi-theme'); } catch (_) {}
  if (saved === 'dark' || saved === 'light') {
    root.dataset.theme = saved;
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    root.dataset.theme = 'dark';
  }
  button.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('fengxi-theme', next); } catch (_) {}
  });

  // Desktop pointer glow, subtle 3D tilt and tiny sparkle trail.
  const finePointer = window.matchMedia &&
    window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (finePointer && !reduceMotion) {
    const glow = document.createElement('div');
    glow.className = 'cursor-glow';
    glow.setAttribute('aria-hidden', 'true');
    document.body.appendChild(glow);

    const card = document.querySelector('.social-card');
    const tiles = document.querySelectorAll('.links a');
    let lastSpark = 0;

    window.addEventListener('pointermove', (event) => {
      glow.style.left = event.clientX + 'px';
      glow.style.top = event.clientY + 'px';
      document.body.classList.add('pointer-seen');

      if (card) {
        const rect = card.getBoundingClientRect();
        const inside = event.clientX >= rect.left && event.clientX <= rect.right &&
          event.clientY >= rect.top && event.clientY <= rect.bottom;
        if (inside) {
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          card.style.setProperty('--pointer-x', x + 'px');
          card.style.setProperty('--pointer-y', y + 'px');
          const rx = ((y / rect.height) - .5) * -4;
          const ry = ((x / rect.width) - .5) * 5;
          card.style.transform = `perspective(1100px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
          card.classList.add('pointer-active');
        } else {
          card.style.transform = '';
          card.classList.remove('pointer-active');
        }
      }

      tiles.forEach((tile) => {
        const rect = tile.getBoundingClientRect();
        if (event.clientX >= rect.left && event.clientX <= rect.right &&
            event.clientY >= rect.top && event.clientY <= rect.bottom) {
          tile.style.setProperty('--tile-x', (event.clientX - rect.left) + 'px');
          tile.style.setProperty('--tile-y', (event.clientY - rect.top) + 'px');
        }
      });

      const now = performance.now();
      if (now - lastSpark > 75) {
        lastSpark = now;
        const spark = document.createElement('i');
        spark.className = 'pointer-spark';
        spark.setAttribute('aria-hidden', 'true');
        spark.style.left = event.clientX + 'px';
        spark.style.top = event.clientY + 'px';
        document.body.appendChild(spark);
        spark.addEventListener('animationend', () => spark.remove(), { once: true });
      }
    }, { passive: true });

    window.addEventListener('pointerleave', () => {
      document.body.classList.remove('pointer-seen');
      if (card) {
        card.style.transform = '';
        card.classList.remove('pointer-active');
      }
    });
  }

})();
</script>
